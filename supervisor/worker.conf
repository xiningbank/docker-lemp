[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:worker-default]
directory=/var/www/html/%(ENV_SUPERVISOR_APP_FOLDER)s
command=php artisan queue:work --queue=%(ENV_SUPERVISOR_QUEUES_DEFAULT)s --sleep=3 --tries=3
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[group:laravel-worker]
programs=worker-default
